[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-systems-practicum"
version = "0.1.0"
description = "Agentic Systems Practicum: an interactive novice-to-pro curriculum for building AI agents with LLMs."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kevin Mills", email = "millsks@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
practicum = "practicum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/practicum", "src/agentlab"]

[tool.hatch.build.targets.sdist]
include = ["src/practicum", "src/agentlab", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests requiring real I/O, network, or DB",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "D"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104"]
"projects/**/tests/**" = ["D100", "D103", "D104"]
"projects/conftest.py" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["practicum", "agentlab"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.git-cliff.changelog]
header = "# Changelog\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^chore", skip = true },
]
